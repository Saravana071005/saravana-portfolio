<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="#334155" stroke-width="3"/>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <circle cx="98" cy="30" r="5" fill="url(#accentGrad)" filter="url(#glow)" />

  <g font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800">
    <text x="32" y="78" font-size="44" fill="#FFFFFF" letter-spacing="-1">S</text>
    <text x="64" y="78" font-size="44" fill="url(#accentGrad)" letter-spacing="-1">L</text>
  </g>
  <path d="M32 88 H96" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
